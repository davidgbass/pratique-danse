<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T.Rex">
<meta name="robots" content="noindex, nofollow">
<title>T.Rex</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px 20px 40px;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    background: #1b1530; color: #fff; text-align: center;
    -webkit-user-select: none; user-select: none;
  }
  h1 { margin: 8px 0 24px; font-size: 40px; letter-spacing: 2px; }
  h2 { margin: 0 0 10px; font-size: 18px; font-weight: normal; color: #b8b0d6; }
  .presets { margin: 0 0 30px; }
  .presets button {
    width: 15%; min-width: 64px; margin: 4px 0.5%; padding: 18px 0;
    font-size: 22px; font-weight: bold; border: 0; border-radius: 12px;
    background: #3a3060; color: #fff;
  }
  .presets button.actif { background: #ffcf4a; color: #1b1530; }
  .lecture { margin: 0 0 30px; }
  .lecture button {
    padding: 18px 0; font-size: 26px; font-weight: bold; border: 0; border-radius: 16px;
    background: #3a3060; color: #fff; width: 35%; margin: 0 1%;
  }
  .lecture #play { background: #4ad295; color: #1b1530; width: 45%; }
  .sections { position: relative; height: 70px; margin: 0 0 8px; }
  .sections button {
    position: absolute; top: 0; height: 70px; padding: 0;
    border: 0; border-left: 3px solid #1b1530; border-radius: 0;
    background: #3a3060; color: #fff; font-size: 22px; font-weight: bold;
  }
  .sections button span { display: block; font-size: 12px; font-weight: normal; color: #b8b0d6; }
  .sections button.choisi { background: #ff7a59; }
  .sections button.choisi span { color: #fff; }
  .tete { position: absolute; top: -6px; width: 4px; height: 82px; margin-left: -2px; background: #ffcf4a; pointer-events: none; }
  input[type=range] { width: 100%; height: 44px; margin: 0; }
  .temps { font-size: 18px; color: #b8b0d6; margin-top: 6px; }
  .aide { font-size: 15px; color: #8a82a8; margin-top: 18px; }
  .tout { margin-top: 14px; }
  .tout button {
    padding: 12px 18px; margin: 0 4px; font-size: 17px; border: 0; border-radius: 12px;
    background: #2a2248; color: #fff;
  }
</style>
</head>
<body>

<h1>T.REX</h1>

<h2>Vitesse</h2>
<div class="presets" id="presets">
  <button data-v="50">50 %</button><button data-v="60">60 %</button><button data-v="70">70 %</button><button data-v="80">80 %</button><button data-v="90">90 %</button><button data-v="100">100 %</button>
</div>

<div class="lecture">
  <button id="debut">&#9198; Début</button><button id="play">&#9654; Jouer</button>
</div>

<h2>Parties à répéter</h2>
<div class="sections" id="sections"><div class="tete" id="tete"></div></div>
<input type="range" id="position" min="0" max="1000" step="1" value="0">
<div class="temps"><span id="ecoule">0:00</span> / <span id="total">0:00</span></div>
<div class="tout"><button id="toutes">Toute la chanson</button><button id="aucune">Aucune</button></div>
<div class="aide">Touche une ou plusieurs parties : elles jouent en boucle.</div>

<audio id="audio" src="trex.m4a" preload="auto"></audio>

<script>
(function () {
  // Début et fin de chaque partie, en secondes
  var SECTIONS = [
    { debut: 0,    fin: 34.6 },
    { debut: 34.6, fin: 44.3 },
    { debut: 44.3, fin: 58.5 },
    { debut: 58.5, fin: 81.9 },
    { debut: 81.9, fin: 99.6 }
  ];
  var FIN = SECTIONS[SECTIONS.length - 1].fin;

  var audio = document.getElementById('audio');
  var presets = document.getElementById('presets').getElementsByTagName('button');
  var play = document.getElementById('play');
  var position = document.getElementById('position');
  var ecoule = document.getElementById('ecoule');
  var total = document.getElementById('total');
  var bande = document.getElementById('sections');
  var tete = document.getElementById('tete');
  var vitesse = 100;
  var choisi = [];
  var boutons = [];
  var glisse = false;

  // Garder la hauteur du son quand on ralentit
  audio.preservesPitch = true;
  audio.webkitPreservesPitch = true;
  audio.mozPreservesPitch = true;

  function format(s) {
    if (!isFinite(s)) { return '0:00'; }
    var m = Math.floor(s / 60);
    var r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  // Vitesse
  function appliquer() {
    audio.playbackRate = vitesse / 100;
    for (var i = 0; i < presets.length; i++) {
      presets[i].className = (parseInt(presets[i].getAttribute('data-v'), 10) === vitesse) ? 'actif' : '';
    }
    try { localStorage.setItem('vitesse', vitesse); } catch (e) {}
  }

  try {
    var memo = parseInt(localStorage.getItem('vitesse'), 10);
    if (memo >= 50 && memo <= 100) { vitesse = memo; }
  } catch (e) {}
  appliquer();

  for (var i = 0; i < presets.length; i++) {
    presets[i].addEventListener('click', function () {
      vitesse = parseInt(this.getAttribute('data-v'), 10);
      appliquer();
    });
  }

  // Parties
  function premiereChoisie() {
    for (var i = 0; i < SECTIONS.length; i++) { if (choisi[i]) { return i; } }
    return -1;
  }

  function partieA(t) {
    for (var i = 0; i < SECTIONS.length; i++) {
      if (t >= SECTIONS[i].debut && t < SECTIONS[i].fin) { return i; }
    }
    return -1;
  }

  function dessiner() {
    for (var i = 0; i < boutons.length; i++) {
      boutons[i].className = choisi[i] ? 'choisi' : '';
    }
  }

  function allerA(t) {
    // Un vieil iPad refuse le saut tant que la piste n'est pas chargée : on attend
    if (audio.readyState < 1) {
      audio.addEventListener('loadedmetadata', function f() {
        audio.removeEventListener('loadedmetadata', f);
        allerA(t);
      });
      return;
    }
    try { audio.currentTime = t; } catch (e) {}
    ecoule.innerHTML = format(t);
  }

  // Safari atterrit parfois un peu avant le point demandé : une demi-seconde de marge
  var MARGE = 0.5;
  function dansChoisie(t) {
    for (var i = 0; i < SECTIONS.length; i++) {
      if (choisi[i] && t >= SECTIONS[i].debut - MARGE && t < SECTIONS[i].fin) { return true; }
    }
    return false;
  }

  // Si la tête de lecture n'est pas dans une partie choisie, sauter à la prochaine
  function verifier() {
    if (premiereChoisie() < 0 || audio.seeking) { return; }
    var t = audio.currentTime;
    if (dansChoisie(t)) { return; }
    var p = partieA(t);
    var depart = (p < 0) ? (t < SECTIONS[0].debut ? 0 : SECTIONS.length) : p + 1;
    for (var k = 0; k < SECTIONS.length; k++) {
      var j = (depart + k) % SECTIONS.length;
      if (choisi[j]) { allerA(SECTIONS[j].debut); return; }
    }
  }

  function basculer(i) {
    choisi[i] = !choisi[i];
    dessiner();
    if (premiereChoisie() >= 0 && !dansChoisie(audio.currentTime)) {
      allerA(choisi[i] ? SECTIONS[i].debut : SECTIONS[premiereChoisie()].debut);
    }
  }

  for (var s = 0; s < SECTIONS.length; s++) {
    choisi.push(false);
    var b = document.createElement('button');
    b.style.left = (SECTIONS[s].debut / FIN * 100) + '%';
    b.style.width = ((SECTIONS[s].fin - SECTIONS[s].debut) / FIN * 100) + '%';
    b.innerHTML = (s + 1) + '<span>' + format(SECTIONS[s].debut) + '</span>';
    b.setAttribute('data-i', s);
    b.addEventListener('click', function () { basculer(parseInt(this.getAttribute('data-i'), 10)); });
    bande.insertBefore(b, tete);
    boutons.push(b);
  }

  document.getElementById('toutes').addEventListener('click', function () {
    for (var i = 0; i < choisi.length; i++) { choisi[i] = true; }
    dessiner();
    verifier();
  });
  document.getElementById('aucune').addEventListener('click', function () {
    for (var i = 0; i < choisi.length; i++) { choisi[i] = false; }
    dessiner();
  });

  // Lecture
  play.addEventListener('click', function () {
    if (audio.paused) { verifier(); audio.play(); } else { audio.pause(); }
  });

  document.getElementById('debut').addEventListener('click', function () {
    var p = premiereChoisie();
    allerA(p >= 0 ? SECTIONS[p].debut : 0);
  });

  // Une boucle serrée pendant la lecture, pour ne pas déborder sur la partie suivante
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(f, 50); };
  function tic() {
    verifier();
    if (!audio.paused) { raf(tic); }
  }

  // Safari remet parfois la vitesse à 1 au démarrage : on la réapplique
  audio.addEventListener('play', function () { appliquer(); play.innerHTML = '&#10074;&#10074; Pause'; raf(tic); });
  audio.addEventListener('playing', appliquer);
  audio.addEventListener('pause', function () { play.innerHTML = '&#9654; Jouer'; });

  audio.addEventListener('loadedmetadata', function () { total.innerHTML = format(FIN); });
  audio.addEventListener('timeupdate', function () {
    verifier();
    ecoule.innerHTML = format(audio.currentTime);
    tete.style.left = Math.min(audio.currentTime / FIN * 100, 100) + '%';
    if (!glisse && audio.duration) {
      position.value = Math.round(Math.min(audio.currentTime / FIN, 1) * 1000);
    }
  });

  position.addEventListener('touchstart', function () { glisse = true; });
  position.addEventListener('mousedown', function () { glisse = true; });
  position.addEventListener('input', function () {
    glisse = true;
    if (audio.duration) { ecoule.innerHTML = format(position.value / 1000 * FIN); }
  });
  position.addEventListener('change', function () {
    if (audio.duration) { audio.currentTime = position.value / 1000 * FIN; }
    glisse = false;
  });

  audio.addEventListener('ended', function () {
    var p = premiereChoisie();
    if (p >= 0) {
      allerA(SECTIONS[p].debut);
      audio.play();
    }
  });
})();
</script>
</body>
</html>
